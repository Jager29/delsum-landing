<p>reviews works!</p>
<section id="reviews" class="reviews-section">
  <h2 class="section-title">Lo que dicen nuestros clientes</h2>
  <p class="section-subtitle">Experiencias reales, sabor 100% artesanal</p>

  <div class="reviews-grid">
    <div class="review-card" *ngFor="let r of reviews">
      <p class="review-text">{{ r.text }}</p>
      <div class="reviewer">
        <img *ngIf="r.avatar" [src]="r.avatar" [alt]="r.name" class="reviewer-avatar" />
        <div class="reviewer-info">
          <span class="reviewer-name">{{ r.name }}</span>
          <span *ngIf="r.position" class="reviewer-position">{{ r.position }}</span>
        </div>
      </div>
    </div>
  </div>
</section>
